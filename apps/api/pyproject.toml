[project]
name = "sg4-api"
version = "0.1.0"
description = "FastAPI backend: MySQL + Redis + MinIO + WebSocket"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # multipart/form-data 解析 (POST /files/upload 依赖)
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    # --- MySQL (async) ---
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    # 同步驱动: 仅用于 alembic 迁移与容器启动探活
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    # --- migrations ---
    "alembic>=1.14.0",
    # --- auth ---
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<5",
    "email-validator>=2.2.0",
    # --- redis / pubsub ---
    "redis>=5.2.0",
    # --- object storage ---
    "minio>=7.2.9",
    # --- websocket ---
    "websockets>=13.0",
    # --- observability ---
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "fakeredis>=2.26.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-passlib>=1.7.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# =============================================================================
# uv 依赖源: 国内网络可取消注释使用清华镜像
# =============================================================================
# [[tool.uv.index]]
# name = "tuna"
# url = "https://pypi.tuna.tsinghua.edu.cn/simple"
# default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
