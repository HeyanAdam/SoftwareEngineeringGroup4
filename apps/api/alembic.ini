# =============================================================================
# Alembic configuration.
#
# NOTE: keep this file ASCII-only. Alembic/logging read it through ConfigParser
# with the platform locale encoding (cp936/cp1252 on Windows), so non-ASCII
# comments would raise UnicodeDecodeError there.
#
# The database URL is NOT maintained here: alembic/env.py resolves it, in order:
#   1. command line override:  alembic -x db_url=mysql+pymysql://user:pass@host/db upgrade head
#   2. environment variable:   ALEMBIC_DATABASE_URL=mysql+pymysql://...
#   3. application settings:   app.core.config.settings.sync_database_url
#      (derived from DATABASE_URL, swapping mysql+aiomysql -> mysql+pymysql)
# So the DATABASE_URL injected by docker compose / .env works for migrations too.
# The value below is only a placeholder; env.py always overrides it at runtime.
# =============================================================================

[alembic]
script_location = alembic
# Make the `app` package importable when running alembic without installing it.
prepend_sys_path = .
# Generated file name: 20250101_1200_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
sqlalchemy.url = mysql+pymysql://sg4:sg4-change-me@127.0.0.1:3306/sg4?charset=utf8mb4

# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
