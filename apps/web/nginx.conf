# =============================================================================
# apps/web 生产站点配置
#  - SPA history 回退到 index.html
#  - /api/ 反向代理到 api:8000
#  - /ws WebSocket 升级代理 (长连接读超时)
#  - gzip 压缩 + /assets/ 长缓存
# =============================================================================

upstream sg4_api {
  server api:8000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  # 上传大文件时放宽请求体限制 (与后端 MAX_UPLOAD_SIZE_MB=50 对齐;
  # 留 4m 余量给 multipart 边界与其它表单字段)
  client_max_body_size 54m;

  # ------------------------------- gzip -------------------------------
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/wasm
    image/svg+xml
    font/woff
    font/woff2;

  # ------------------------- 静态资源缓存策略 -------------------------
  # 带内容哈希的构建产物: 永久缓存
  location /assets/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:ico|png|jpe?g|gif|webp|svg|woff2?|eot|ttf|otf)$ {
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # index.html 绝不缓存, 保证发布后立即生效
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires -1;
  }

  # --------------------------- REST 反向代理 ---------------------------
  location /api/ {
    proxy_pass http://sg4_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }

  # ---------------------------- WebSocket ----------------------------
  location /ws {
    proxy_pass http://sg4_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    # 长连接: 读超时 1 小时, 禁用缓冲
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # --------------------------- SPA 回退 ---------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 隐藏文件与源码映射不外泄
  location ~ /\.(?!well-known) {
    deny all;
  }
}
