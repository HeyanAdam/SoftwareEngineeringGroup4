# =============================================================================
# SG4 —— Redis 配置文件范例 (备选方案)
#
# 现状: docker-compose.yml 采用 **命令行参数** 方式启动 Redis:
#   command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes",
#             "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
#
# 本文件是等价的 **配置文件** 写法, 适合参数变多、需要精细调优时切换。
# 切换方式(二选一, 不要同时做):
#   A. 把本文件挂进容器并指定配置:
#        redis:
#          command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
#          volumes:
#            - redis_data:/data
#            - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
#   B. 官方镜像默认只执行 `redis-server`(无配置文件), 因此"只挂载不指定"不会生效 ——
#      必须在 command 中显式写出配置文件路径, 即上面的 A 方案。
#
# 密码: 本文件写的是占位符, 请勿提交真实密码。若使用本文件, 建议把下面
#       requirepass 一行改为指向 .env 中的值(Compose 会对挂载文件做变量替换吗?
#       不会 —— 它只替换 compose 文件本身), 因此更稳妥的做法是保留命令行参数,
#       或在此处写一个占位值并在部署时用 sed/entrypoint 注入。
#
# 校验(不连接任何实例, 只做语法自检):
#   docker run --rm -v "${PWD}/infra/redis/redis.conf:/tmp/redis.conf:ro" redis:7.4-alpine \
#     redis-server /tmp/redis.conf --daemonize no
#   能正常打印 "Ready to accept connections" 即语法通过; Ctrl+C 退出。
#   注意本文件默认端口 6379, 若宿主机/容器已占用该端口, 自检会启动失败并报端口占用。
# =============================================================================

# ---------------------------------------------------------------------------
# 网络 / 访问控制
# ---------------------------------------------------------------------------
# 监听所有网卡(容器内必须 0.0.0.0, 仅靠 compose 的端口映射 + 密码做隔离)
bind 0.0.0.0
port 6379
# 保护模式: 有密码且绑定了非回环地址时应设为 no, 否则容器外连不上
protected-mode no
# 密码(占位符 —— 真实值来自 .env 的 REDIS_PASSWORD / 命令行 --requirepass)
requirepass CHANGE_ME_REDIS_PASSWORD
# 禁止危险命令改名/禁用(按需开启, 生产建议禁用 FLUSHALL/FLUSHDB/KEYS)
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command KEYS ""

# ---------------------------------------------------------------------------
# 持久化: AOF 为主(RDB 作为补充)
# ---------------------------------------------------------------------------
# appendonly yes -> 每条写命令落盘, 重启不丢数据;
# 缓存类数据可改为 no 并只用 RDB 以提升吞吐。
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
# everysec: 每秒 fsync, 性能与安全的平衡点(always 最安全但最慢, no 交给 OS)
appendfsync everysec
# AOF 重写期间不 fsync, 避免阻塞
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

dir /data

# ---------------------------------------------------------------------------
# RDB 快照策略: 900 秒内 >=1 次写 / 300 秒内 >=10 次 / 60 秒内 >=10000 次
# ---------------------------------------------------------------------------
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# ---------------------------------------------------------------------------
# 内存与淘汰策略
# ---------------------------------------------------------------------------
# 上限 512mb, 与 compose 命令行参数保持一致(容器内存受限时记得同步下调)
maxmemory 512mb
# allkeys-lru: 所有 key 参与 LRU 淘汰 —— 适合纯缓存场景;
# 若 Redis 里同时存放"不能丢"的数据(如队列/会话), 请改为 volatile-lru
# 并给可淘汰的 key 设置 TTL。
maxmemory-policy allkeys-lru
maxmemory-samples 5

# ---------------------------------------------------------------------------
# 日志与慢查询
# ---------------------------------------------------------------------------
# 空字符串表示输出到 stdout, 交给 docker logs 收集
logfile ""
loglevel notice
# 慢查询阈值(微秒): 10000 = 10ms, -1 表示关闭
slowlog-log-slower-than 10000
slowlog-max-len 128
# 连接数上限(与 ulimit 配合, 默认 10000)
maxclients 10000
timeout 0
tcp-keepalive 300

# ---------------------------------------------------------------------------
# 其他
# ---------------------------------------------------------------------------
databases 16
# 关闭可能带来安全风险的模块化命令(示例)
# enable-debug-command no
# 时区/本地化不影响 Redis, 但容器 TZ 由 compose 的 TZ 环境变量控制
