name: ✨ 功能需求
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景与问题
      description: 当前遇到了什么痛点? 谁受影响?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望怎么解决? 关键交互/接口形态是什么?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过哪些其它做法? 为什么不选?
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 涉及技术栈
      multiple: true
      options:
        - Vue3 / Element Plus
        - ECharts
        - FastAPI
        - MySQL
        - Redis
        - MinIO
        - WebSocket
        - Docker / CI
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - P2 一般 (默认)
        - P1 重要
        - P0 阻塞
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: |
        - [ ] 接口 GET /api/v1/xxx 返回 ...
        - [ ] 前端页面支持 ...
    validations:
      required: false
