name: 🐛 Bug 反馈
description: 报告一个可复现的缺陷
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈! 请尽量提供可复现信息, 便于快速定位。
  - type: textarea
    id: what-happened
    attributes:
      label: 现象描述
      description: 发生了什么? 期望是什么?
      placeholder: 打开文件列表页时白屏, 控制台报 500
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 登录 admin
        2. 进入「文件管理」
        3. 上传 20MB PDF
        4. 页面报错
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 影响模块
      multiple: true
      options:
        - 前端 apps/web
        - 后端 apps/api
        - WebSocket 实时通信
        - 文件/MinIO
        - 数据库/迁移
        - Docker/部署
        - CI/流水线
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: git commit sha, 或镜像 tag
      placeholder: main@a1b2c3d
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错
      description: |
        后端: `docker compose logs api --tail=200`
        前端: 浏览器控制台 + Network 响应体 (本项目错误统一为 {code,message,data})
      render: shell
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: 运行环境
      placeholder: |
        OS: Windows 11 / macOS 15 / Ubuntu 24.04
        浏览器: Chrome 131
        部署方式: docker compose / 本机裸跑
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索过现有 Issue, 确认不是重复问题
          required: true
        - label: 已在最新 main 分支复现
          required: false
