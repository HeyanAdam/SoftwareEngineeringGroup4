# =============================================================================
# 后端 CI: ruff + mypy + pytest (SQLite/内存替身, 无需外部服务)
# =============================================================================
name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sg4_test
          MYSQL_USER: sg4
          MYSQL_PASSWORD: sg4
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      SECRET_KEY: ci-secret-key-for-tests-only-0123456789
      DATABASE_URL: mysql+aiomysql://sg4:sg4@127.0.0.1:3306/sg4_test?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/0
      AUTO_CREATE_TABLES: "1"
      SEED_DEMO_DATA: "0"
      MINIO_ENDPOINT: 127.0.0.1:9000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check app tests --output-format=github

      - name: Ruff (format check)
        run: ruff format --check app tests

      - name: Mypy (type check, non-blocking)
        continue-on-error: true
        run: mypy app

      - name: Alembic migration sanity (offline SQL render)
        run: alembic upgrade head --sql > /tmp/migration.sql && head -n 20 /tmp/migration.sql

      - name: Pytest
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: apps/api/coverage.xml
          if-no-files-found: ignore

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: sg4-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
