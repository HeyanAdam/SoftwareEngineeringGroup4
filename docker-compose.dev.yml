# =============================================================================
# SG4 —— 本地开发覆盖文件 (override)
#
# 场景 A: 只启动基础设施(mysql/redis/minio/createbuckets), 在宿主机上裸跑后端/前端
#   copy .env.example .env
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.dev.yml up -d
#   → 默认只启动这 4 个服务: api / web 被放在 "full" profile 里, 不会被拉起。
#   → 显式写法(不依赖 profile 语义, 最稳): 
#       docker compose --env-file .env up -d mysql redis minio createbuckets
#
# 场景 B: 容器化后端 + 热重载 (前端仍在宿主机跑 `pnpm dev`)
#       docker compose --env-file .env -f docker-compose.yml -f docker-compose.dev.yml \
#         --profile full --profile dev up -d mysql redis minio createbuckets api-dev
#   api-dev 会挂载 apps/api 并以 `uvicorn --reload` 启动, 改代码即生效。
#
# 场景 C: 连容器化前端开发服务器一起跑(Vite dev server)
#       docker compose --env-file .env -f docker-compose.yml -f docker-compose.dev.yml \
#         --profile dev up -d mysql redis minio createbuckets api-dev web-dev
#   web-dev 使用 node:22-alpine 而非前端生产镜像(生产镜像的运行阶段是 nginx, 没有
#   node/pnpm), 首次启动会执行 pnpm install, 依赖装在命名卷 node_modules 里。
#
# 注意: 场景 B/C 中的 api-dev 与生产 api 争用 ${API_PORT}; 请勿同时启动两者
#       (即不要用 `--profile full --profile dev up -d` 不带服务名地一把梭)。
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # api / web: 加上 "full" profile —— 默认 dev 调用不启动它们
  # ---------------------------------------------------------------------------
  api:
    profiles: ["full"]
    environment:
      # 本地开发打开更多日志
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      # 开发时通常只跑 1 个 worker, 便于断点/日志追踪
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    # 开发时把源码挂进容器(可写: uvicorn 需要写 .pyc), 便于快速验证改动。
    # 生产文件 (docker-compose.yml) 不挂载任何源码, 代码固化在镜像内。
    volumes:
      - ./apps/api:/app

  web:
    profiles: ["full"]

  # ---------------------------------------------------------------------------
  # api-dev: 后端热重载 (profile "dev")
  # ---------------------------------------------------------------------------
  api-dev:
    profiles: ["dev"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-sg4}-api:dev
    container_name: ${COMPOSE_PROJECT_NAME:-sg4}-api-dev
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: ${DATABASE_URL:-mysql+aiomysql://${MYSQL_USER:-sg4}:${MYSQL_PASSWORD:?}@mysql:3306/${MYSQL_DATABASE:-sg4}?charset=utf8mb4}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?}@redis:6379/0}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-127.0.0.1:${MINIO_API_PORT:-9000}}
      MINIO_BUCKET: ${MINIO_BUCKET:-sg4-files}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:?}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?}}
      RUN_MIGRATIONS: "1"
      AUTO_CREATE_TABLES: "${AUTO_CREATE_TABLES:-1}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-1}"
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    # 覆盖镜像 CMD(scripts/start.sh): 直接以 --reload 启动, 跳过 alembic/初始数据,
    # 便于反复改代码时快速重启。
    # 需要迁移时手动执行: docker compose exec api-dev alembic upgrade head
    entrypoint: ["uvicorn"]
    command: ["app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # 源码热重载(可写, --reload 需要写 __pycache__ / .pyc)
      - ./apps/api:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_net

  # ---------------------------------------------------------------------------
  # web-dev: 前端 Vite 开发服务器 (profile "dev")
  # 刻意 *不* 复用前端生产镜像: 它的运行阶段是 nginx, 里面没有 node/pnpm。
  # 这里直接用 node:22-alpine + corepack(pnpm), 与 apps/web/Dockerfile 的构建阶段一致。
  # ---------------------------------------------------------------------------
  web-dev:
    profiles: ["dev"]
    image: node:22-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-sg4}-web-dev
    working_dir: /app
    # 首次启动安装依赖, 然后启动 Vite。
    # 关键: vite.config.ts 里 server.host=127.0.0.1(仅容器回环), 必须用 --host 覆盖成
    # 0.0.0.0 才能从宿主机访问。
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        corepack enable
        corepack prepare pnpm@9.12.0 --activate
        [ -d node_modules ] || pnpm install --no-frozen-lockfile
        exec pnpm dev --host 0.0.0.0 --port 5173
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # Vite 的 server.proxy 目标 (见 apps/web/vite.config.ts), 容器内要指向 api-dev
      VITE_DEV_API_TARGET: http://api-dev:8000
      VITE_APP_TITLE: ${VITE_APP_TITLE:-SG4 管理台}
    ports:
      # 前端 dev server 默认 5173; 与生产 web 的 ${WEB_PORT}(8080) 分开, 互不冲突
      - "${WEB_DEV_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      # Linux 版 node_modules 单独存命名卷, 避免与宿主机的 Windows 依赖互相覆盖
      - web_node_modules:/app/node_modules
    depends_on:
      api-dev:
        condition: service_started
    networks:
      - app_net

  # ---------------------------------------------------------------------------
  # 基础设施的 dev 微调
  # ---------------------------------------------------------------------------
  mysql:
    # 开发时打开慢查询日志, 便于排查 ORM / N+1 问题
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --explicit_defaults_for_timestamp=ON
      - --default-time-zone=+08:00
      - --slow_query_log=ON
      - --long_query_time=1

volumes:
  # web-dev 专用的 Linux node_modules (仅开发使用)
  web_node_modules:
    name: ${COMPOSE_PROJECT_NAME:-sg4}_web_node_modules
